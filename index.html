<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEMFLIX</title>
    <style>
        /* Base Netflix Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Header / Nav */
        header {
            padding: 20px 4%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            position: fixed;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
        }
        
        /* Fixed, Integrated Curved Logo Asset */
        .logo-container {
            width: 140px;
            height: 45px;
            display: flex;
            align-items: center;
        }

        /* Hero Billboard (Default Desktop Design) */
        .billboard {
            height: 85vh;
            position: relative;
            background-image: 
                linear-gradient(to right, #111 30%, rgba(17, 17, 17, 0.5) 60%, rgba(17, 17, 17, 0) 100%),
                linear-gradient(to top, #111 0%, rgba(17,17,17,0) 20%),
                url('Mowni and Kevin.jpeg');
            background-position: right center; 
            background-size: contain; 
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            padding: 0 4%;
        }
        
        .billboard-content {
            max-width: 550px;
            z-index: 2;
            position: relative;
        }
        .billboard h1 {
            font-size: 3.8rem;
            margin-bottom: 12px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            font-weight: bold;
        }
        .billboard p {
            font-size: 1.25rem;
            line-height: 1.4;
            margin-bottom: 25px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
            color: #e5e5e5;
        }
        .btn {
            padding: 12px 28px;
            background-color: #fff;
            color: #000;
            border: none;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: rgba(255,255,255,0.75);
        }

        /* Video Rows */
        .row {
            padding: 20px 4%;
            position: relative;
            z-index: 3;
            background-color: #111;
        }
        .row h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #e5e5e5;
        }
        .row-inner {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 15px 0;
            -webkit-overflow-scrolling: touch;
        }
        .row-inner::-webkit-scrollbar {
            display: none;
        }
        
        /* Cards */
        .tile {
            min-width: 280px;
            height: 158px;
            background-color: #222;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .tile:hover {
            transform: scale(1.12);
            z-index: 5;
        }
        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .tile-title {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding: 15px 10px 10px 10px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        /* Video Popup Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            width: 85%;
            max-width: 900px;
            position: relative;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }
        .modal video {
            width: 100%;
            height: 100%;
        }
        .close-modal {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* =========================================================
           UPDATED MOBILE RESPONSIVE ENGINE RULES
           ========================================================= */
        @media (max-width: 768px) {
            header {
                justify-content: flex-start; /* Forces the logo to stick to the LEFT side on mobile */
                padding: 15px 4%;
            }
            .logo-container {
                width: 110px;
                height: 35px;
            }
            
            .billboard {
                height: 80vh;
                flex-direction: column;
                justify-content: flex-end; 
                padding: 0 5% 30px 5%;
                
                /* Precision mobile background alignment and framing */
                background-image: 
                    linear-gradient(to top, #111 30%, rgba(17, 17, 17, 0.3) 60%, rgba(17,17,17,0) 100%),
                    url('Mowni and Kevin.jpeg');
                
                /* Nudges the photo framing down and right so their faces are beautifully preserved */
                background-position: 62% 20%; 
                
                /* Perfectly scales down the wide landscape image layout to breathe on mobile views */
                background-size: 160%; 
            }

            .billboard-content {
                max-width: 100%;
                text-align: center; 
            }

            .billboard h1 {
                font-size: 2.2rem;
                margin-bottom: 8px;
            }

            .billboard p {
                font-size: 0.95rem;
                margin-bottom: 20px;
            }

            .btn {
                padding: 10px 24px;
                font-size: 1rem;
                width: 100%; 
                justify-content: center;
            }

            .row {
                padding: 20px 4% 10px 4%;
            }

            .row h2 {
                font-size: 1.1rem;
                margin-bottom: 10px;
            }

            .tile {
                min-width: 180px; 
                height: 102px;
            }

            .tile-title {
                font-size: 0.75rem;
                padding: 6px;
            }
            
            .modal-content {
                width: 95%; 
            }
            .close-modal {
                top: -35px;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="100%">
                <g fill="#E50914">
                    <path d="M40 10h22v47l36-47h26L84 62l43 64h-25L62 76v50H40V10z"/>
                    <path d="M142 10h56v20h-34v27h30v19h-30v29h35v21h-57V10z"/>
                    <path d="M214 10h26l21 61 21-61h25v116h-21V48l-20 57h-11l-20-57v78h-21V10z"/>
                    <path d="M322 10h52v20h-30v29h27v19h-27v48h-22V10z"/>
                    <path d="M390 10h22v96h32v20h-54V10z"/>
                    <path d="M460 10h22v116h-22V10z"/>
                    <path d="M496 10h24l26 53 26-53h24L560 67l38 59h-25l-27-46-27 46h-24l37-59-37-58z"/>
                </g>
                <path d="M 0 140 Q 300 112 600 140 Z" fill="#111111"/>
            </svg>
        </div>
    </header>

    <section class="billboard">
        <div class="billboard-content">
            <h1>The Perfect Match</h1>
            <p>A beautiful journey of love, laughter, and happily ever after. Streaming exclusively in our hearts.</p>
            <button class="btn" onclick="openPlayer('https://www.w3schools.com/html/mov_bbb.mp4')"><span>►</span> Play Trailer</button>
        </div>
    </section>

    <section class="row">
        <h2>Trending Now: The Wedding Chronicles</h2>
        <div class="row-inner">
            
            <div class="tile" onclick="openPlayer('https://www.w3schools.com/html/mov_bbb.mp4')">
                <img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?q=80&w=400" alt="Thumbnail">
                <div class="tile-title">Ep 1: The Pre-Wedding Chaos</div>
            </div>
            
            <div class="tile" onclick="openPlayer('https://www.w3schools.com/html/movie.mp4')">
                <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=400" alt="Thumbnail">
                <div class="tile-title">Ep 2: The Sangeet Dance-Off</div>
            </div>
            
            <div class="tile" onclick="openPlayer('https://www.w3schools.com/html/mov_bbb.mp4')">
                <img src="https://images.unsplash.com/photo-1519225495810-7512c696505a?q=80&w=400" alt="Thumbnail">
                <div class="tile-title">Ep 3: The Grand Entrance</div>
            </div>
            
            <div class="tile" onclick="openPlayer('https://www.w3schools.com/html/movie.mp4')">
                <img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=400" alt="Thumbnail">
                <div class="tile-title">Ep 4: Haldi Ceremonies</div>
            </div>

        </div>
    </section>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePlayer()">&times;</button>
            <video id="mainPlayer" controls autoplay playsinline></video>
        </div>
    </div>

    <script>
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('mainPlayer');

        function openPlayer(videoUrl) {
            player.src = videoUrl;
            modal.style.display = 'flex';
            player.play();
        }

        function closePlayer() {
            modal.style.display = 'none';
            player.pause();
            player.src = "";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closePlayer();
            }
        }
    </script>

</body>
</html>
